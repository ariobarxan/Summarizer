[project]
name = "local-page-summarizer"
version = "0.1.0"
description = "Local webpage summarizer with an explicit mock provider"
requires-python = ">=3.12"
dependencies = ["gradio>=6.31,<7", "playwright>=1.64,<2", "trafilatura>=2.3,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1", "mypy>=1.18,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/summarizer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
